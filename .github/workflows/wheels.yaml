name: Wheels

# Builds the wheels (abi3, one per platform for every Python from 3.11) and tests those that
# run on the build runner with the DigSim tests (test: full), or only imports them. A tag
# vX.Y.Z attaches them to a release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The DigSim branch that has the engine interface of this version
  DIGSIM_REF: use-digsim-native

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --release -- -D warnings

  wheels:
    name: wheel ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: "2014", test: full }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: "2014", test: full }
          - { name: musllinux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { name: musllinux-aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { name: windows-x64, os: windows-latest, target: x64, rust: x86_64-pc-windows-msvc, python-arch: x64, test: full }
          # DigSim's dependencies don't load on Windows arm64 (importing digsim exits with 127)
          - { name: windows-arm64, os: windows-11-arm, target: aarch64, rust: aarch64-pc-windows-msvc, python-arch: arm64, test: import }
          - { name: macos-arm64, os: macos-latest, target: aarch64, rust: aarch64-apple-darwin, python-arch: arm64, test: full }
          # Cross-compiled on the arm64 runner, not tested
          - { name: macos-x86_64, os: macos-latest, target: x86_64, rust: x86_64-apple-darwin, python-arch: arm64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        if: runner.os != 'Linux'
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python-arch }}

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux'
        with:
          targets: ${{ matrix.rust }}

      - name: Build
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist

      - uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl

      - uses: actions/setup-python@v7
        if: matrix.test == 'full' && runner.os == 'Linux'
        with:
          python-version: "3.13"

      - name: Import
        if: matrix.test == 'import'
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python -c "import digsim_native; digsim_native.Engine"

      - uses: actions/checkout@v7
        if: matrix.test == 'full'
        with:
          repository: freand76/digsim
          ref: ${{ env.DIGSIM_REF }}
          path: digsim

      - name: Test with DigSim
        if: matrix.test == 'full'
        shell: bash
        working-directory: digsim
        run: |
          python -m pip install --upgrade pip
          python -m pip install ../dist/*.whl . "pytest==9.1.1"
          python -c "from digsim.circuit import _native; assert _native.mode() == 'native'"
          python -m pytest -q

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          test "v$version" = "$GITHUB_REF_NAME"
          grep -q "^version = \"$version\"" Cargo.toml

      - uses: actions/download-artifact@v7
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          links="https://github.com/$GITHUB_REPOSITORY/releases/expanded_assets/$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" dist/*.whl --title "$GITHUB_REF_NAME" \
            --notes "pip install digsim-native==${GITHUB_REF_NAME#v} --find-links $links"
