name: PyPI

# Uploads the wheels of a GitHub release to PyPI, started by hand:
#   gh workflow run pypi.yaml -f tag=vX.Y.Z
# PyPI trusts this workflow (Trusted Publishing), so there is no token. Set it up once on
# PyPI: publisher freand76/digsim-native, workflow pypi.yaml, environment pypi.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release to upload, vX.Y.Z"
        required: true

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/digsim-native/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the wheels of the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.whl" --dir dist

      - uses: pypa/gh-action-pypi-publish@release/v1
