[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "digsim-native"
version = "0.1.0"
description = "Optional native simulation engine for DigSim"
authors = [{name = "Fredrik Andersson", email = "freand@gmail.com"}]
readme = "README.md"
license-files = ["LICENSE.md"]
urls = { homepage = "https://github.com/freand76/digsim-native", digsim = "https://github.com/freand76/digsim" }
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Rust",
]

[tool.maturin]
features = ["pyo3/extension-module"]
